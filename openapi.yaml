openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: PaperBoy HTTP API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >-
    Tenant-bound transactional email API. API keys select one organization and
    one live or test environment. Stored instants and HTTP timestamps are RFC
    3339 UTC. The queue is provider-neutral: self-hosted SMTP and Cloudflare
    Email Service and Amazon SES use the same messages, limits, suppressions,
    and event model. The signed-in console renders this contract at `/app/docs`.
    The Rust CLI in `crates/paperboy` calls the same bearer-key routes.
servers:
  - url: /
    description: Same origin as the PaperBoy deployment
security:
  - bearerAuth: []
tags:
  - name: Emails
    description: Queue one message and inspect its environment-scoped state.
  - name: Events
    description: Read one message's ordered delivery lifecycle.
  - name: Open tracking
    description: Manage opt-in first-party open tracking and serve its signed pixel.
  - name: Outbound providers
    description: Select and test organization and sending-domain delivery routes.
  - name: Webhooks
    description: Configure the organization's signed event destination.
  - name: Webhook delivery
    description: Signed event payload PaperBoy posts to a configured receiver. Not a client route.
  - name: Rate limits
    description: Read and override organization live and test send caps.
  - name: Templates
    description: Store and preview organization email templates.
  - name: Segments
    description: Group contacts into named segments.
  - name: Topics
    description: Manage topic subscriptions for contacts.
  - name: Contacts
    description: Manage organization contacts and imports.
  - name: Contact properties
    description: Define custom contact property keys.
  - name: Events
    description: Define and send custom events for automations.
  - name: Automations
    description: Run event-triggered automation workflows.
  - name: Logs
    description: Inspect API request logs.
  - name: API keys
    description: Manage scoped organization API keys.
  - name: Audiences
    description: Manage permission-based audiences and contacts.
  - name: Broadcasts
    description: Snapshot an audience and queue one stored template.
  - name: Suppressions
    description: Block future sends to bounced, complained, or opted-out addresses.
x-paperboy-mcp:
  description: >-
    MCP is a peer interface over the same tenant-bound services. Protocol
    timestamps remain UTC and organization context always comes from the key.
  equivalents:
    sendEmail: paperboy_send_email
    sendEmailBatch: paperboy_send_email_batch
    getEmail: paperboy_get_delivery_status
    listEmailEvents: paperboy_list_message_events
    getOpenTracking: paperboy_get_open_tracking
    updateOpenTracking: paperboy_update_open_tracking
    getOutboundProviders: paperboy_get_outbound_providers
    updateOutboundProviders: paperboy_update_outbound_providers
    testOutboundProvider: paperboy_test_outbound_provider
    ingestOutboundProviderEvent: paperboy_ingest_outbound_provider_event
    getWebhook: paperboy_get_webhook
    configureWebhook: paperboy_configure_webhook
    shareEmail: paperboy_share_email
    listEmailAttachments: paperboy_list_email_attachments
    getEmailAttachment: paperboy_get_email_attachment
    getEmailMetrics: paperboy_get_email_metrics
    listWebhooks: paperboy_list_webhooks
    createWebhook: paperboy_create_webhook
    updateWebhook: paperboy_update_webhook
    deleteWebhook: paperboy_delete_webhook
    listWebhookEvents: paperboy_list_webhook_events
    getWebhookEvent: paperboy_get_webhook_event
    replayWebhookEvent: paperboy_replay_webhook_event
    listWebhookEventAttempts: paperboy_list_webhook_event_attempts
    getRateLimits: paperboy_get_rate_limits
    updateRateLimits: paperboy_update_rate_limits
    listTemplates: paperboy_list_templates
    createTemplate: paperboy_create_template
    getTemplate: paperboy_get_template
    updateTemplate: paperboy_update_template
    deleteTemplate: paperboy_delete_template
    previewTemplate: paperboy_preview_template
    publishTemplate: paperboy_publish_template
    duplicateTemplate: paperboy_duplicate_template
    listApiKeys: paperboy_list_api_keys
    createApiKey: paperboy_create_api_key
    getApiKey: paperboy_get_api_key
    updateApiKey: paperboy_update_api_key
    revokeApiKey: paperboy_revoke_api_key
    listSegments: paperboy_list_segments
    createSegment: paperboy_create_segment
    getSegment: paperboy_get_segment
    updateSegment: paperboy_update_segment
    deleteSegment: paperboy_delete_segment
    listTopics: paperboy_list_topics
    createTopic: paperboy_create_topic
    getTopic: paperboy_get_topic
    updateTopic: paperboy_update_topic
    deleteTopic: paperboy_delete_topic
    listContactProperties: paperboy_list_contact_properties
    createContactProperty: paperboy_create_contact_property
    getContactProperty: paperboy_get_contact_property
    updateContactProperty: paperboy_update_contact_property
    deleteContactProperty: paperboy_delete_contact_property
    listOrgContacts: paperboy_list_org_contacts
    createOrgContact: paperboy_create_org_contact
    getOrgContact: paperboy_get_org_contact
    updateOrgContact: paperboy_update_org_contact
    deleteOrgContact: paperboy_delete_org_contact
    listContactSegments: paperboy_list_contact_segments

    WebhookEndpoint:
      type: object
      additionalProperties: false
      required: [created_at, enabled, id, updated_at, url]
      properties:
        created_at:
          $ref: '#/components/schemas/UtcDateTime'
        enabled:
          type: boolean
        id:
          type: string
          format: uuid
        updated_at:
          $ref: '#/components/schemas/UtcDateTime'
        url:
          type: string
          format: uri
    Webhook:
      type: object
      additionalProperties: false
      required: [created_at, enabled, id, updated_at, url]
      properties:
        created_at:
          $ref: '#/components/schemas/UtcDateTime'
        enabled:
          type: boolean
        id:
          type: string
          format: uuid
        updated_at:
          $ref: '#/components/schemas/UtcDateTime'
        url:
          type: string
          format: uri
    WebhookListEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Webhook'
    WebhookCreateInput:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        enabled:
          type: boolean
        url:
          type: string
          format: uri

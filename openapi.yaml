    importSuppressions: paperboy_import_suppressions
paths:
  /api/v1/emails:
    get:
      operationId: listEmails
      tags: [Emails]
      summary: List emails
      description: >-
        Lists messages in the organization and environment selected by the
        bearer key, newest first. Timestamps are RFC 3339 UTC. Attachment
        bytes, hashes, and storage keys are never returned.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: One page of message summaries and the matching total.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: sendEmail
      tags: [Emails]
      summary: Queue one email
      description: >-
        Validates and stores one provider-neutral message. Test keys always use
        the isolated test sink. Live keys require a verified organization domain,
        active DKIM state, and configured credentials for the resolved organization
        default or domain override. Provider choice is snapshotted on the queued
        message. Cloudflare Email Service remains responsible for provider-owned
        DKIM and ARC signatures. Idempotency may be supplied in the header or JSON
        body and is active for 24 hours per API key. A future scheduled_at
        holds the message until its time; past values send immediately.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmailInput'
      responses:
        '200':
          description: Message accepted or safely replayed under the same idempotency key.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuedEmail'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The idempotency key was used with a different request inside its 24-hour window.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Decoded attachments exceed the 10 MiB per-message limit.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          description: The organization reached its fixed UTC-minute environment limit.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Retry-After:
              description: Whole seconds until the shared organization window resets.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/received-emails:
    post:
      operationId: receiveInboundEmail
      tags: [Emails]
      summary: Store one inbound email
      description: >-
        Accepts a raw RFC 822 `email` string or parsed from/to/subject/html/text
        fields. Live keys require at least one recipient domain to be a verified
        organization sending domain, including plus-addresses used by support
        desks. Returned mail such as out-of-office auto-replies and bounce
        reports is discarded without storage or `email.received`. A configured
        organization webhook receives `email.received` with routing metadata
        only; fetch the body with GET /api/v1/received-emails/{emailId}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiveInboundEmailInput'
      responses:
        '201':
          description: Inbound email stored.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivedEmailAccepted'
        '200':
          description: Identical inbound email replayed.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivedEmailAccepted'
        '202':
          description: Returned auto-reply or bounce discarded without storage.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivedEmailDiscarded'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/received-emails/{emailId}:
    parameters:
      - $ref: '#/components/parameters/EmailId'
    get:
      operationId: getReceivedEmail
      tags: [Emails]
      summary: Get one inbound email
      description: >-
        Returns the stored inbound email for the organization and environment
        selected by the bearer key. Support desks use this after `email.received`
        to read the customer reply body.
      responses:
        '200':
          description: Stored inbound email.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivedEmail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/received-emails/{emailId}/attachments:
    parameters:
      - $ref: '#/components/parameters/EmailId'
    get:
      operationId: listReceivedEmailAttachments
      tags: [Emails]
      summary: List one inbound email's attachments
      responses:
        '200':
          description: Attachment metadata with signed download URLs.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievedEmailAttachmentListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/received-emails/{emailId}/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/EmailId'
      - $ref: '#/components/parameters/AttachmentId'
    get:
      operationId: getReceivedEmailAttachment
      tags: [Emails]
      summary: Get one inbound email attachment
      responses:
        '200':
          description: Attachment metadata with a signed download URL.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailAttachment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/emails/{emailId}:
    parameters:
      - $ref: '#/components/parameters/EmailId'
    get:
      operationId: getEmail
      tags: [Emails]
      summary: Get one email
      description: >-
        Returns one message from the organization and environment selected by
        the bearer key. Attachment metadata is safe; stored bytes, hashes, and
        storage keys are never returned.
      responses:
        '200':
          description: Current message state and semantic content.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Email'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: rescheduleEmail
      tags: [Emails]
      summary: Reschedule a queued email
      description: >-
        Moves a still-queued message to a new scheduled_at instant. Only
        queued messages can be rescheduled; sent, failed, and cancelled
        messages are rejected. Past values make the message due immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleEmailInput'
      responses:
        '200':
          description: Rescheduled message state and semantic content.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Email'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/emails/{emailId}/cancel:
    parameters:
      - $ref: '#/components/parameters/EmailId'
    post:
      operationId: cancelEmail
      tags: [Emails]
      summary: Cancel a queued email
      description: >-
        Marks a still-queued message cancelled so the worker never hands it
        to the provider. Cancelling after send is rejected.
      responses:
        '200':
          description: Cancelled message state and semantic content.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Email'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/emails/metrics:
    get:
      operationId: getEmailMetrics
      tags: [Emails]
      summary: Aggregate email metrics
      description: >-
        Totals always cover the range; data rows appear when a dimension is
        requested. Email and broadcast dimensions cannot be combined.
      parameters:
        - name: start_date
          in: query
          required: false
          schema:
            type: string
        - name: end_date
          in: query
          required: false
          schema:
            type: string
        - name: timezone
          in: query
          required: false
          schema:
            type: string
            default: UTC
        - name: granularity
          in: query
          required: false
          schema:
            type: string
            enum: [hourly, daily, weekly, monthly]
            default: daily
        - name: metrics
          in: query
          required: false
          schema:
            type: string
        - name: dimensions
          in: query
          required: false
          schema:
            type: string
        - name: domain_id
          in: query
          required: false
          schema:
            type: string
        - name: email_id
          in: query
          required: false
          schema:
            type: string
        - name: broadcast_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Metric totals with optional breakdowns.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailMetrics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/emails/{emailId}/share:
    parameters:
      - $ref: '#/components/parameters/EmailId'
    post:
      operationId: shareEmail
      tags: [Emails]
      summary: Create a shareable link for one email
      description: Links expire after at most 48 hours.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareEmailInput'
      responses:
        '200':
          description: Shareable link.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedEmail'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/emails/{emailId}/attachments:
    parameters:
      - $ref: '#/components/parameters/EmailId'
    get:
      operationId: listEmailAttachments
      tags: [Emails]
      summary: List one email's attachments
      responses:
        '200':
          description: Attachment metadata with signed download URLs.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievedEmailAttachmentListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/emails/{emailId}/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/EmailId'
      - $ref: '#/components/parameters/AttachmentId'
    get:
      operationId: getEmailAttachment
      tags: [Emails]
      summary: Get one email attachment
      responses:
        '200':
          description: Attachment metadata with a signed download URL.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailAttachment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/shared/{token}:
    get:
      operationId: getSharedEmail
      tags: [Emails]
      summary: Read a shared email
      description: Public signed link access. No API key required.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Shared message content.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedEmailContent'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/attachments/download:
    get:
      operationId: downloadAttachment
      tags: [Emails]
      summary: Download shared attachment bytes
      description: Public signed link access. No API key required.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Attachment bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/emails/{emailId}/events:
    parameters:
      - $ref: '#/components/parameters/EmailId'
    get:
      operationId: listEmailEvents
      tags: [Events]
      summary: List one email's events
      description: >-
        Returns the stable UTC lifecycle ordered by creation instant and an
        internal sequence. The internal sequence is not exposed.
      responses:
        '200':
          description: Ordered message event list.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MessageEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/open-tracking:
    get:
      operationId: getOpenTracking
      tags: [Open tracking]
      summary: Read organization open tracking
      description: >-
        Returns the privacy-first organization flag. It is false by default;
        current members can read it and tenant context comes from the key.
      responses:
        '200':
          description: Current organization setting with a UTC update instant.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenTrackingSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateOpenTracking
      tags: [Open tracking]
      summary: Update organization open tracking
      description: >-
        Owners and admins can opt future HTML messages in or out. Enabling
        requires a public PaperBoy URL and a dedicated signing key. Plain-text
        and existing queued messages are unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenTrackingUpdateInput'
      responses:
        '200':
          description: Saved organization setting with a UTC update instant.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenTrackingSettings'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /o/{messageId}/{signature}.gif:
    get:
      operationId: recordOpen
      tags: [Open tracking]
      summary: Fetch the signed first-party open pixel
      security: []
      description: >-
        Always returns the same uncacheable transparent GIF. A valid signed URL
        for an opted-in message records at most one opened event; invalid URLs
        reveal no message state. Fetches may originate from scanners or proxies.
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: signature
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{43}$'
      responses:
        '200':
          description: One transparent GIF regardless of token validity.
          headers:
            Cache-Control:
              description: Pixel responses are not cacheable.
              schema:
                type: string
            Cross-Origin-Resource-Policy:
              description: Allows the first-party image to render in email clients.
              schema:
                type: string
                const: cross-origin
          content:
            image/gif:
              schema:
                type: string
                format: binary
        4XX:
          description: >-
            A deployment edge rejected malformed HTTP before the request
            reached PaperBoy. The application handler itself masks token and
            message validity behind the 200 GIF response.
  /c/{messageId}/{signature}:
    get:
      operationId: recordClick
      tags: [Open tracking]
      summary: Follow a signed first-party click redirect
      security: []
      description: >-
        Verifies the message-bound signature and target URL, records at most
        one clicked event per message, then redirects to the original http(s)
        URL. Invalid or untracked links return 404 without revealing message
        state.
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: signature
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{43}$'
        - name: u
          in: query
          required: true
          schema:
            type: string
            format: uri
            maxLength: 2048
      responses:
        '302':
          description: Verified click recorded; redirect to the original URL.
        '404':
          description: Invalid signature, untracked message, or disallowed target.

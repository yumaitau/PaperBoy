          $ref: '#/components/schemas/UtcDateTime'
        url:
          type: string
          format: uri
    WebhookUpdateInput:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        url:
          type: string
          format: uri
          maxLength: 2048
    WebhookDelivery:
      type: object
      additionalProperties: false
      required: [attempt_count, created_at, delivered_at, endpoint_id, event_type, failed_at, failure_reason, id, last_attempt_at, last_error_code, response_status, status, updated_at, url]
      properties:
        attempt_count:
          type: integer
          minimum: 0
        created_at:
          $ref: '#/components/schemas/UtcDateTime'
        delivered_at:
          $ref: '#/components/schemas/NullableUtcDateTime'
        endpoint_id:
          type: string
          format: uuid
        event_type:
          type: [string, 'null']
        failed_at:
          $ref: '#/components/schemas/NullableUtcDateTime'
        failure_reason:
          type: [string, 'null']
        id:
          type: string
          format: uuid
        last_attempt_at:
          $ref: '#/components/schemas/NullableUtcDateTime'
        last_error_code:
          type: [string, 'null']
        response_status:
          type: [integer, 'null']
        status:
          type: string
        updated_at:
          $ref: '#/components/schemas/UtcDateTime'
        url:
          type: string
    WebhookDeliveryListEnvelope:
      type: object
      additionalProperties: false

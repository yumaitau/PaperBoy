            type: integer
    MessageEvent:
      type: object
      additionalProperties: false
      required: [created_at, data, id, message_id, type]
      properties:
        created_at:
          $ref: '#/components/schemas/UtcDateTime'
        data:
          type: object
          additionalProperties: true
        id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [queued, delivered, deferred, bounced, complained, opened, clicked, scheduled, cancelled]
    WebhookConfigurationInput:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048

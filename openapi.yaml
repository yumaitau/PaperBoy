webhooks:
  messageEvent:
    post:
      operationId: receiveMessageEvent
      tags: [Webhook delivery]
      summary: Receive a signed message event
      description: >-
        PaperBoy posts this request to the configured endpoint. Verify the raw
        request body before JSON parsing. Compute Base64 HMAC-SHA256 over
        `<webhook-id>.<webhook-timestamp>.<raw-body>` using the Base64-decoded
        portion of the `whsec_` secret, compare in constant time, and reject
        timestamps outside five minutes.
      security: []
      parameters:
        - name: webhook-id
          in: header
          required: true
          description: Stable event UUID; unchanged across retries.
          schema:
            type: string
            format: uuid
        - name: webhook-timestamp
          in: header
          required: true
          description: Unix timestamp in whole seconds for this attempt.
          schema:
            type: integer
            minimum: 0
        - name: webhook-signature
          in: header
          required: true
          description: Versioned signature in `v1,<Base64 HMAC-SHA256>` form.
          schema:
            type: string
            pattern: '^v1,[A-Za-z0-9+/]+={0,2}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        2XX:
          description: Any 2xx response acknowledges the event and stops retries.
        '400':
          description: Receiver rejected an invalid or stale signed request.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: pb_live_... or pb_test_...
      description: >-
        Organization- and environment-bound PaperBoy API key. Keep it in a
        protected server environment and never place it in a URL.
  parameters:
    EmailId:
      name: emailId
      in: path
      required: true
      description: PaperBoy message UUID.
      schema:
        type: string
        format: uuid
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      description: Attachment UUID.
      schema:
        type: string
        format: uuid
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AudienceId:
      name: audienceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContactId:
      name: contactId
      in: path
      required: true
      description: Contact UUID or email address.
      schema:
        type: string
    BroadcastId:
      name: broadcastId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SuppressionId:
      name: suppressionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebhookId:
      name: webhookId
      in: path
      required: true
      description: Webhook UUID.
      schema:
        type: string
        format: uuid
    WebhookEventId:
      name: eventId
      in: path
      required: true
      description: Webhook delivery UUID.
      schema:
        type: string
        format: uuid
    ApiKeyId:
      name: apiKeyId
      in: path
      required: true
      description: PaperBoy API key UUID.
      schema:
        type: string
        format: uuid
    SegmentId:
      name: segmentId
      in: path
      required: true
      description: Segment UUID.
      schema:
        type: string
        format: uuid
    TopicId:
      name: topicId
      in: path
      required: true
      description: Topic UUID.
      schema:
        type: string
        format: uuid
    ContactPropertyId:
      name: propertyId
      in: path
      required: true
      description: Contact property UUID.
      schema:
        type: string
        format: uuid
    ContactImportId:
      name: importId
      in: path
      required: true
      description: Contact import UUID.
      schema:
        type: string
        format: uuid
    AutomationId:
      name: automationId
      in: path
      required: true
      description: Automation UUID.
      schema:
        type: string
        format: uuid
    AutomationRunId:
      name: runId
      in: path
      required: true
      description: Automation run UUID.
      schema:
        type: string
        format: uuid
    ApiLogId:
      name: logId
      in: path
      required: true
      description: Request log UUID.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Alternative to JSON `idempotency_key`. If both are present they must
        match exactly. Reusing it with the same normalized request during its
        API-key-scoped 24-hour window returns the original message ID.
      schema:
        $ref: '#/components/schemas/IdempotencyKeyValue'
  headers:
    NoStore:
      description: Private API responses are never cacheable.
      schema:
        type: string
        const: no-store
  responses:
    InvalidJson:
      description: Request body is not valid JSON.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Bearer key is missing, malformed, or revoked.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        WWW-Authenticate:
          description: PaperBoy bearer challenge.
          schema:
            type: string
            example: Bearer realm="PaperBoy"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: The API-key creator's current membership or role no longer permits the operation.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: The tenant- or environment-scoped resource does not exist.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationFailed:
      description: One or more request fields are invalid or the recipient/domain is unavailable.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: PaperBoy could not complete the operation.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: Required operator configuration or private storage is unavailable.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    OutboundProvider:
      type: string
      enum: [smtp, cloudflare-email, aws-ses, azure-email]
    MessageOutboundProvider:
      type: string
      enum: [smtp, cloudflare-email, aws-ses, azure-email, test-sink]
    OutboundProviderCapabilities:
      type: object
      additionalProperties: false
      required: [batch, events, scheduling]
      properties:
        batch:
          type: boolean
        events:
          type: boolean
        scheduling:
          type: boolean
    OutboundProviderStatus:
      type: object
      additionalProperties: false
      required: [capabilities, configured, credential_scope, id, label, state]
      properties:
        capabilities:
          $ref: '#/components/schemas/OutboundProviderCapabilities'
        configured:
          type: boolean
        credential_scope:
          type: [string, 'null']
          enum: [operator-default, organization, null]
        id:
          $ref: '#/components/schemas/OutboundProvider'
        label:
          type: string
        state:
          type: string
          enum: [adapter-unavailable, configuration-invalid, credentials-missing, ready]
    OutboundProviderDomainSetting:
      type: object
      additionalProperties: false
      required: [domain_id, effective_provider, name, override_provider, updated_at]
      properties:
        domain_id:
          type: string
          format: uuid
        effective_provider:
          $ref: '#/components/schemas/OutboundProvider'
        name:
          type: string
        override_provider:
          oneOf:
            - $ref: '#/components/schemas/OutboundProvider'
            - type: 'null'
        updated_at:
          $ref: '#/components/schemas/UtcDateTime'
    OutboundProviderSettings:
      type: object
      additionalProperties: false
      required: [default_provider, domains, protocol_time_zone, providers, updated_at]
      properties:
        default_provider:
          $ref: '#/components/schemas/OutboundProvider'
        domains:
          type: array
          items:
            $ref: '#/components/schemas/OutboundProviderDomainSetting'
        protocol_time_zone:
          type: string
          const: UTC
        providers:
          type: array
          items:
            $ref: '#/components/schemas/OutboundProviderStatus'
        updated_at:
          $ref: '#/components/schemas/UtcDateTime'
    OutboundProviderDomainOverrideInput:
      type: object
      additionalProperties: false
      required: [domain_id, provider]
      properties:
        domain_id:
          type: string
          format: uuid
        provider:
          oneOf:
            - $ref: '#/components/schemas/OutboundProvider'
            - type: 'null'
    OutboundProviderUpdateInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        default_provider:
          $ref: '#/components/schemas/OutboundProvider'
        domain_overrides:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/OutboundProviderDomainOverrideInput'
    OutboundProviderTestInput:
      type: object
      additionalProperties: false
      required: [provider]
      properties:
        provider:
          $ref: '#/components/schemas/OutboundProvider'
    OutboundProviderTestResult:
      type: object
      additionalProperties: false
      required: [details, ok, protocol_time_zone, provider, tested_at]
      properties:
        details:
          oneOf:
            - $ref: '#/components/schemas/OutboundProviderConnectionDetails'
            - type: 'null'
        ok:
          type: boolean
          const: true
        protocol_time_zone:
          type: string
          const: UTC
        provider:
          $ref: '#/components/schemas/OutboundProvider'
        tested_at:
          $ref: '#/components/schemas/UtcDateTime'
    OutboundProviderConnectionDetails:
      type: object
      additionalProperties: false
      required: [account_mode, region, sending_enabled, verified_domains]
      properties:
        account_mode:
          type: string
          enum: [sandbox, production]
        region:
          type: string
          pattern: '^[a-z]{2}(?:-[a-z0-9]+)+-[0-9]$'
        sending_enabled:
          type: boolean
        verified_domains:
          type: array
          maxItems: 100000
          uniqueItems: true
          items:
            type: string
            format: hostname
            maxLength: 253
    AwsSesEventInput:
      type: object
      additionalProperties: true
      description: One SES event, SNS notification envelope, or EventBridge event. Maximum encoded size is 512 KiB.
    AwsSnsEnvelope:
      type: object
      additionalProperties: true
      required: [Message, MessageId, Signature, SignatureVersion, SigningCertURL, Timestamp, TopicArn, Type]
      properties:
        Message:
          type: string
        MessageId:
          type: string
        Signature:
          type: string
        SignatureVersion:
          type: string
          enum: ['1', '2']
        SigningCertURL:
          type: string
          format: uri
        Timestamp:
          $ref: '#/components/schemas/UtcDateTime'
        TopicArn:
          type: string
        Type:
          type: string
          enum: [Notification, SubscriptionConfirmation, UnsubscribeConfirmation]
    OutboundProviderEventResult:
      type: object
      additionalProperties: false
      required: [created_at, event_id, message_id, provider, provider_event_id, replayed, suppression_count, type]
      properties:
        created_at:
          $ref: '#/components/schemas/UtcDateTime'
        event_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        provider:
          type: string
          const: aws-ses
        provider_event_id:
          type: string
        replayed:
          type: boolean
        suppression_count:
          type: integer
          minimum: 0
          maximum: 50
        type:
          type: string
          enum: [delivered, deferred, bounced, complained]
    OutboundProviderEventEnvelope:
      type: object
      additionalProperties: false
      required: [data, protocol_time_zone]
      properties:
        data:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OutboundProviderEventResult'
        protocol_time_zone:
          type: string
          const: UTC
    OpenTrackingSettings:
      type: object
      additionalProperties: false
      required: [enabled, protocol_time_zone, updated_at]
      properties:
        enabled:
          type: boolean
        protocol_time_zone:
          type: string
          const: UTC
        updated_at:
          $ref: '#/components/schemas/UtcDateTime'
    OpenTrackingUpdateInput:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
    SendEmailInput:
      oneOf:
        - $ref: '#/components/schemas/InlineEmailInput'
        - $ref: '#/components/schemas/TemplateEmailInput'
    InlineEmailInput:
      type: object
      additionalProperties: false
      required: [from, to, subject]
      anyOf:
        - required: [html]
          properties:
            html:
              type: string
              minLength: 1
        - required: [text]
          properties:
            text:
              type: string
              minLength: 1
      properties:
        from:
          $ref: '#/components/schemas/Sender'
        to:
          $ref: '#/components/schemas/Recipients'
        subject:
          type: string
          minLength: 1
          maxLength: 998
          pattern: '^(?=.*\S)[^\r\n]*$'
        html:
          type: string
          maxLength: 2097152
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKeyValue'
        text:
          type: string
          maxLength: 2097152
        tags:
          $ref: '#/components/schemas/EmailTags'
        attachments:
          $ref: '#/components/schemas/EmailAttachments'
        reply_to:
          $ref: '#/components/schemas/Recipients'
        cc:
          $ref: '#/components/schemas/Recipients'
        bcc:
          $ref: '#/components/schemas/Recipients'
        headers:
          $ref: '#/components/schemas/EmailHeaders'
        scheduled_at:
          $ref: '#/components/schemas/ScheduledAt'
    TemplateEmailInput:
      type: object
      additionalProperties: false
      required: [from, to, template_id]
      properties:
        from:
          $ref: '#/components/schemas/Sender'
        to:
          $ref: '#/components/schemas/Recipients'
        template_id:
          type: string
          format: uuid
        data:
          type: object
          additionalProperties: true
          default: {}
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKeyValue'
        tags:
          $ref: '#/components/schemas/EmailTags'
        attachments:
          $ref: '#/components/schemas/EmailAttachments'
        reply_to:
          $ref: '#/components/schemas/Recipients'
        cc:
          $ref: '#/components/schemas/Recipients'
        bcc:
          $ref: '#/components/schemas/Recipients'
        headers:
          $ref: '#/components/schemas/EmailHeaders'
        scheduled_at:
          $ref: '#/components/schemas/ScheduledAt'
    Sender:
      type: string
      minLength: 3
      maxLength: 320
      description: Plain address or `Display name <address@example.com>` form.
      examples:
        - PaperBoy <news@mail.example.com>
    Recipients:
      oneOf:
        - type: string
          minLength: 3
          maxLength: 320
        - type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            minLength: 3
            maxLength: 320
    EmailTags:
      type: array
      maxItems: 75
      items:
        $ref: '#/components/schemas/EmailTag'
      default: []
    EmailTag:
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^[A-Za-z0-9_-]+$'
        value:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^[A-Za-z0-9_-]+$'
    EmailHeaders:
      type: object
      description: Custom MIME headers. Delivery headers such as From, To, Cc, Bcc, Subject, and Date are reserved.
      maxProperties: 50
      additionalProperties:
        type: string
        minLength: 1
        maxLength: 998
        pattern: '^[^\r\n]*$'
      default: {}
    ScheduledAt:
      type: string
      format: date-time
      description: ISO 8601 instant. Future values queue the message for later delivery; past values send immediately.
      examples:
        - '2026-09-06T01:30:00Z'
    EmailAttachments:
      type: array
      maxItems: 100
      description: Decoded bytes across all items may total at most 10 MiB.
      items:
        $ref: '#/components/schemas/EmailAttachment'
      default: []
    EmailAttachment:
      type: object
      additionalProperties: false
      required: [content, filename, content_type]
      properties:
        content:
          type: string
          minLength: 1
          contentEncoding: base64
          description: Canonical Base64 file bytes.
        content_id:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^[^\\s<>,;]+$'
          description: 'Optional CID reference for inline images used as cid: URIs in HTML.'
        filename:
          type: string
          minLength: 1
          description: At most 255 UTF-8 bytes; paths and control characters are rejected.
        content_type:
          type: string
          minLength: 3
          maxLength: 127
          pattern: '^[A-Za-z0-9!#$&^_.+-]+/[A-Za-z0-9!#$&^_.+-]+$'
    QueuedEmail:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          format: uuid
    ReceiveInboundEmailInput:
      type: object
      additionalProperties: false
      description: Raw RFC 822 or parsed inbound fields used by support desks.
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 2097152
        from:
          $ref: '#/components/schemas/Sender'
        to:
          $ref: '#/components/schemas/Recipients'
        cc:
          $ref: '#/components/schemas/Recipients'
        bcc:
          $ref: '#/components/schemas/Recipients'
        subject:
          type: string
          minLength: 1
          maxLength: 998
        html:
          type: string
          maxLength: 2097152
        text:
          type: string
          maxLength: 2097152
        message_id:
          type: string
          minLength: 3
          maxLength: 998
    ReceivedEmailAccepted:
      type: object
      additionalProperties: false
      required: [id, object]
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
          const: email
    ReceivedEmailDiscarded:
      type: object
      additionalProperties: false
      required: [discarded, object, reason]
      properties:
        discarded:
          type: boolean
          const: true
        object:
          type: string
          const: email
        reason:
          type: string
          enum: [auto_reply, bounce]
    ReceivedEmail:
      type: object
      additionalProperties: false
      required: [id, object, from, to, subject, created_at]
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
          const: email
        from:
          type: string
        to:
          type: array
          items:
            type: string
        cc:
          type: array
          items:
            type: string
        bcc:
          type: array
          items:
            type: string
        subject:
          type: string
        html:
          type: [string, 'null']
        text:
          type: [string, 'null']
        message_id:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
    IdempotencyKeyValue:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '^[!-~]+$'
      description: >-
        API-key-scoped key with a 24-hour lifetime measured using PostgreSQL UTC
        instants. A replay does not insert or resubmit a provider message.
    Email:
      type: object
      additionalProperties: false
      required:
        - attachments
        - attempt_count
        - created_at
        - delivery_mode
        - domain_id
        - environment
        - failed_at
        - failure_reason
        - from
        - html
        - id
        - last_attempt_at
        - last_error_code
        - next_attempt_at
        - object
        - bcc
        - cancelled_at
        - cc
        - click_tracking_enabled
        - headers
        - open_tracking_enabled
        - provider_message_id
        - scheduled_at
        - provider
        - sent_at
        - status
        - subject
        - tags
        - text
        - to
        - updated_at
      properties:
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/StoredAttachment'
        attempt_count:
          type: integer
          minimum: 0
        created_at:
          $ref: '#/components/schemas/UtcDateTime'
        delivery_mode:
          type: string
          enum: [live, test-sink]
        domain_id:
          type: [string, 'null']
          format: uuid
        cc:
          type: array
          items:
            type: string
        bcc:
          type: array
          items:
            type: string
        headers:
          $ref: '#/components/schemas/EmailHeaders'
        environment:
          type: string
          enum: [live, test]
        failed_at:
          $ref: '#/components/schemas/NullableUtcDateTime'
        failure_reason:
          type: [string, 'null']
        from:
          type: string
        html:
          type: [string, 'null']
        id:
          type: string
          format: uuid
        last_attempt_at:
          $ref: '#/components/schemas/NullableUtcDateTime'
        last_error_code:
          type: [string, 'null']
        next_attempt_at:
          $ref: '#/components/schemas/NullableUtcDateTime'
        object:
          type: string
          const: email
        open_tracking_enabled:
          type: boolean
        click_tracking_enabled:
          type: boolean
        scheduled_at:
          $ref: '#/components/schemas/NullableUtcDateTime'
        cancelled_at:
          $ref: '#/components/schemas/NullableUtcDateTime'
        provider_message_id:
          type: [string, 'null']
        provider:
          $ref: '#/components/schemas/MessageOutboundProvider'
        sent_at:
          $ref: '#/components/schemas/NullableUtcDateTime'
        status:
          type: string
          enum: [queued, sending, sent, failed, cancelled]
        subject:
          type: string
        tags:
          $ref: '#/components/schemas/EmailTags'
        text:
          type: [string, 'null']
        to:
          type: array
          items:
            type: string
        updated_at:
          $ref: '#/components/schemas/UtcDateTime'
    RescheduleEmailInput:
      type: object
      additionalProperties: false
      required: [scheduled_at]
      properties:
        scheduled_at:
          $ref: '#/components/schemas/ScheduledAt'
    EmailSummary:
      type: object
      additionalProperties: false
      required:
        - cancelled_at
        - created_at
        - domain_id
        - environment
        - from
        - id
        - object
        - provider
        - provider_message_id
        - scheduled_at
        - sent_at
        - status
        - subject
        - to
        - updated_at
      properties:
        cancelled_at:
          $ref: '#/components/schemas/NullableUtcDateTime'
        created_at:
          $ref: '#/components/schemas/UtcDateTime'
        domain_id:
          type: [string, 'null']
          format: uuid
        environment:
          type: string
          enum: [live, test]
        from:
          type: string
        id:
          type: string
          format: uuid
        object:
          type: string
          const: email
        provider:
          $ref: '#/components/schemas/MessageOutboundProvider'
        provider_message_id:
          type: [string, 'null']
        scheduled_at:
          $ref: '#/components/schemas/NullableUtcDateTime'
        sent_at:
          $ref: '#/components/schemas/NullableUtcDateTime'
        status:
          type: string
          enum: [queued, sending, sent, failed, cancelled]
        subject:
          type: string
        to:
          type: array
          items:
            type: string
        updated_at:
          $ref: '#/components/schemas/UtcDateTime'
    EmailListEnvelope:
      type: object
      additionalProperties: false
      required: [data, limit, page, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EmailSummary'
        limit:
          type: integer
          minimum: 1
          maximum: 100
        page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    StoredAttachment:
      type: object
      additionalProperties: false
      required: [content_type, filename, id, size]
      properties:
        content_id:
          type: [string, 'null']
          description: CID reference for inline images, or null for regular attachments.
        content_type:
          type: string
        filename:
          type: string
        id:
          type: string
          format: uuid
        size:
          type: integer
          minimum: 1
          maximum: 10485760
    RetrievedEmailAttachment:
      type: object
      additionalProperties: false
      required: [content_id, content_type, download_url, filename, id]
      properties:
        content_id:
          type: [string, 'null']
        content_type:
          type: string
        download_url:
          type: string
          description: Signed expiring download URL.
        filename:
          type: string
        id:
          type: string
          format: uuid
    RetrievedEmailAttachmentListEnvelope:
      type: object
      additionalProperties: false
      required: [data, object]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RetrievedEmailAttachment'
        object:
          type: string
          const: list
    ShareEmailInput:
      type: object
      additionalProperties: false
      properties:
        expires_in:
          type: string
          description: Duration like 10m, 2 hours, or 1 day. Defaults to 48h and cannot exceed 48 hours.
    SharedEmail:
      type: object
      additionalProperties: false
      required: [expires_at, id, url]
      properties:
        expires_at:
          $ref: '#/components/schemas/UtcDateTime'
        id:
          type: string
          format: uuid
        url:
          type: string
    SharedEmailContent:
      type: object
      additionalProperties: false
      required: [expires_at, from, html, id, subject, text, to]
      properties:
        expires_at:
          $ref: '#/components/schemas/UtcDateTime'
        from:
          type: string
        html:
          type: [string, 'null']
        id:
          type: string
          format: uuid
        subject:
          type: string
        text:
          type: [string, 'null']
        to:
          type: array
          items:
            type: string
    EmailMetrics:
      type: object

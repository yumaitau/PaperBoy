    removeContactFromSegment: paperboy_remove_contact_from_segment
    listContactTopics: paperboy_list_contact_topics
    updateContactTopics: paperboy_update_contact_topics
    createContactImport: paperboy_create_contact_import
    listContactImports: paperboy_list_contact_imports
    getContactImport: paperboy_get_contact_import
    listAutomations: paperboy_list_automations
